<title id="title">Prepare and test the destination</title>
<desc id="desc">Prepare the integration packages and Fleet outputs and policies, then Elasticsearch data structures, using a single ingest pipelines step after enrich reference data and policies. Transfer a subset of data for testing before migrating Kibana spaces and content. Prepare solution configuration, AI and machine learning resources, and access. Test reads and indexing and evaluate the destination. Refine or recreate the project and repeat preparation if needed, or complete the migration and switch to production after validation. Colors distinguish resource groups and do not indicate compatibility.</desc>
