<!-- Semantic source: serverless-migration-navigation-grouped-prepare.mmd. Geometry refined directly in SVG to keep aligned boxes and a smooth return loop. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="174" viewBox="0 0 1040 174" role="img" aria-labelledby="title desc">
  <title id="title">Serverless migration process</title>
  <desc id="desc">Assess, create the project, prepare and test, and switch to production. Within preparation and testing, Prepare, Transfer data, and Test and validate are aligned from left to right. A rounded return arrow leads from Test and validate to Prepare. Transfer data is the current procedure, used during preparation and production.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#748297"/>
    </marker>
  </defs>
  <!-- Inter subset from docs-builder InterVariable.woff2. Font copyright and license records are retained. -->
  <style>
    @font-face { font-family: "Inter Diagram"; font-style: normal; font-weight: 500 600; src: url("data:font/woff2;base64,") format("woff2"); }
    text { font-family: "Inter Diagram", Inter, Arial, sans-serif; fill: #243247; text-anchor: middle; }
    .label { font-size: 18px; font-weight: 500; }
    .group-title { font-size: 18px; font-weight: 600; }
    .box { fill: #f6f9fc; stroke: #bdc2ca; stroke-width: 1.2; }
    .active { fill: #d9e8ff; stroke: #3788ff; stroke-width: 2; }
    .active-label { fill: #123778; }
    .arrow { fill: none; stroke: #748297; stroke-width: 1.6; stroke-linecap: round; marker-end: url(#arrow); }
  </style>

  <rect x="284" y="12" width="580" height="150" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text class="group-title" x="574" y="38">3. Prepare and test destination</text>

  <path class="arrow" d="M120 95 H136"/>
  <path class="arrow" d="M264 95 H280"/>
  <path class="arrow" d="M464 95 H492"/>
  <path class="arrow" d="M652 95 H680"/>
  <path class="arrow" d="M868 95 H884"/>
  <path class="arrow" d="M760 128 V136 Q760 146 750 146 H394 Q384 146 384 136 V128"/>

  <g id="assess">
    <rect class="box" x="12" y="66" width="104" height="58" rx="8"/>
    <text class="label" x="64" y="101">1. Assess</text>
  </g>
  <g id="create">
    <rect class="box" x="140" y="66" width="120" height="58" rx="8"/>
    <text class="label" x="200" y="89"><tspan x="200">2. Create</tspan><tspan x="200" dy="22">project</tspan></text>
  </g>
  <g id="prepare">
    <rect class="box" x="308" y="66" width="152" height="58" rx="8"/>
    <text class="label" x="384" y="101">Prepare</text>
  </g>
  <g id="transfer-data">
    <rect class="active" x="496" y="66" width="152" height="58" rx="8"/>
    <text class="label active-label" x="572" y="101">Transfer data</text>
  </g>
  <g id="test">
    <rect class="box" x="684" y="66" width="152" height="58" rx="8"/>
    <text class="label" x="760" y="89"><tspan x="760">Test and</tspan><tspan x="760" dy="22">validate</tspan></text>
  </g>
  <g id="production">
    <rect class="box" x="888" y="66" width="140" height="58" rx="8"/>
    <text class="label" x="958" y="89"><tspan x="958">4. Switch to</tspan><tspan x="958" dy="22">production</tspan></text>
  </g>
</svg>
