<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 900 864" role="img" aria-labelledby="title desc">
<title id="title">Migration overview</title>
<desc id="desc">Assess the existing solution and create the destination project. Prepare assets, transfer data, test reads and indexing, and evaluate the destination. One branch returns to preparation to refine or recreate the project. The other continues to complete the migration and switch to production, including cutover and rollback preparation, final transfer, client changes, validation, monitoring, and source retirement.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#697586" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<style>
text {font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#243247;}
.heading {font-size:24px;font-weight:700;}
.label {font-size:20px;font-weight:600;text-anchor:middle;}
.caption {font-size:19px;}
.branch {font-size:17px;fill:#526278;}
.number {font-size:16px;font-weight:700;fill:#526278;}
.panel {fill:#F8FAFC;stroke:#CBD5E1;stroke-width:1.3;}
.general {fill:#FFFFFF;stroke:#94A3B8;}
.schema {fill:#EAF3FF;stroke:#2471BD;}
.fleet {fill:#F2EBFF;stroke:#8055B8;}
.kibana {fill:#E5F6F2;stroke:#16816D;}
.solution {fill:#FFF3DF;stroke:#AD6B10;}
.box {stroke-width:1.6;}
.arrow {fill:none;stroke:#697586;stroke-width:1.6;marker-end:url(#arrow);}
</style>
<rect class="panel" x="4" y="4" width="892" height="158" rx="10"/>
<text class="heading" x="25" y="41">1. Assess your existing solution</text>
<rect class="box general" x="32" y="62" width="256" height="74" rx="10"/>
<text class="label" x="160" y="95">Use cases and</text>
<text class="label" x="160" y="120">destination project</text>
<rect class="box general" x="322" y="62" width="256" height="74" rx="10"/>
<text class="label" x="450" y="95">Inventory</text>
<text class="label" x="450" y="120">your assets</text>
<rect class="box general" x="612" y="62" width="256" height="74" rx="10"/>
<text class="label" x="740" y="95">Check</text>
<text class="label" x="740" y="120">compatibility</text>
<path class="arrow" d="M290 99H318"/>
<path class="arrow" d="M580 99H608"/>
<path class="arrow" d="M450 164V184"/>
<rect class="panel" x="4" y="190" width="892" height="140" rx="10"/>
<text class="heading" x="25" y="227">2. Create the destination project</text>
<rect class="box general" x="32" y="248" width="836" height="58" rx="10"/>
<text class="label" x="450" y="284">Select the project type, create the project, and configure access</text>
<path class="arrow" d="M450 332V352"/>
<rect class="panel" x="4" y="358" width="892" height="280" rx="10"/>
<text class="heading" x="25" y="395">3. Prepare and test the destination</text>
<rect class="box general" x="32" y="416" width="256" height="74" rx="10"/>
<text class="label" x="160" y="449">Recreate assets</text>
<text class="label" x="160" y="474">and configuration</text>
<rect class="box general" x="322" y="416" width="256" height="74" rx="10"/>
<text class="label" x="450" y="460">Transfer data</text>
<rect class="box general" x="612" y="416" width="256" height="74" rx="10"/>
<text class="label" x="740" y="449">Test reads and</text>
<text class="label" x="740" y="474">indexing</text>
<path class="arrow" d="M290 453H318"/>
<path class="arrow" d="M580 453H608"/>
<path class="arrow" d="M740 492V510H450V524"/>
<rect class="box general" x="300" y="528" width="300" height="74" rx="10"/>
<text class="label" x="450" y="559">Evaluate readiness</text>
<text class="label" x="450" y="585">Keep or recreate project</text>
<path class="arrow" d="M298 565H160V494"/>
<text class="branch" x="230" y="530" text-anchor="middle">Refine or</text>
<text class="branch" x="230" y="550" text-anchor="middle">recreate</text>
<path class="arrow" d="M450 604V660"/>
<text class="branch" x="465" y="633">Continue when ready</text>
<rect class="panel" x="4" y="666" width="892" height="158" rx="10"/>
<text class="heading" x="25" y="703">4. Complete the migration and switch to production</text>
<rect class="box general" x="32" y="724" width="256" height="74" rx="10"/>
<text class="label" x="160" y="757">Plan cutover</text>
<text class="label" x="160" y="782">and rollback</text>
<rect class="box general" x="322" y="724" width="256" height="74" rx="10"/>
<text class="label" x="450" y="745" style="font-size:17px">Pause writes and finish</text>
<text class="label" x="450" y="767" style="font-size:17px">the transfer</text>
<text class="label" x="450" y="789" style="font-size:17px">Switch clients and validate</text>
<rect class="box general" x="612" y="724" width="256" height="74" rx="10"/>
<text class="label" x="740" y="757">Monitor and</text>
<text class="label" x="740" y="782">retire the source</text>
<path class="arrow" d="M290 761H318"/>
<path class="arrow" d="M580 761H608"/>
<text class="caption" x="25" y="856">Complete preparation and tests before switching production traffic.</text>
</svg>
