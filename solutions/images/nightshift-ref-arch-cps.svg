<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" role="img" aria-labelledby="ns-ra-cps-title ns-ra-cps-desc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="ns-ra-cps-title">nightshift reference architecture: Serverless with cross-project search</title>
<desc id="ns-ra-cps-desc">nightshift runs in a Serverless Observability project that is linked by cross-project search to other Serverless projects that hold the data. Detection works across the linked projects. Investigation works across the linked projects through the Local Elasticsearch connector.</desc>
