<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" role="img" aria-labelledby="ns-ra-self-title ns-ra-self-desc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="ns-ra-self-title">nightshift reference architecture: self-managed cluster</title>
<desc id="ns-ra-self-desc">nightshift runs in a Serverless Observability project. The data is in a self-managed cluster. Detection does not work: sources cannot reach the cluster. Investigation is possible with care, marked with a warning: an External Elasticsearch connector works only if the cluster Elasticsearch endpoint is reachable from the internet and secured with TLS, a read-only API key and restricted access.</desc>
