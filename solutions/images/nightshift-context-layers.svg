<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 460" width="1100" height="460" role="img" aria-labelledby="ns-ctx-title ns-ctx-desc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="ns-ctx-title">How nightshift builds context</title>
<desc id="ns-ctx-desc">Context is a stack of four layers. At the bottom is your telemetry: logs, metrics, and traces. Above it are Knowledge Indicators: services, infrastructure, and dependencies that Detection learns from your telemetry. These two layers come from your data. Detection uses Knowledge Indicators to raise significant events, which can start an investigation. Next is your knowledge: runbooks and code in GitHub, custom context, and automation instructions, which come from you. At the top are learnings, the Wiki and Memory, which come from past investigations. An investigation reads your telemetry, your knowledge, and the learnings, but not Knowledge Indicators, and writes what it learns back to the Wiki and Memory.</desc>
