<title id="ns-ra-single-title">nightshift reference architecture: single Serverless project</title>
<desc id="ns-ra-single-desc">nightshift runs in a Serverless Observability project that also holds the data. Detection works: ES|QL sources read the data in the same project. Investigation works: it queries the data through the Local Elasticsearch connector.</desc>
