name: "Issues: Scope"
on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  discussions: write
  issues: write
  pull-requests: write
  copilot-requests: write
  id-token: write

jobs:
  run:
    # Automatic: every new issue. Manual: /scope from a member, owner, or collaborator, to scope
    # again after the issue changes.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'issues' ||
      (github.event_name == 'issue_comment' &&
       startsWith(github.event.comment.body, '/scope') &&
       github.event.issue.pull_request == null &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    uses: elastic/docs-actions/.github/workflows/gh-aw-issue-scope.lock.yml@v1
    with:
      project-instructions-path: .github/scope-instructions.md
    secrets: inherit
