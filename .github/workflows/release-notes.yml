name: "Release notes: Check"
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review, converted_to_draft]
  push:
    branches: [main]
permissions: {}
jobs:
  release-notes:
    permissions:
      contents: read
      pull-requests: read
      packages: read
      id-token: write
    uses: elastic/docs-actions/.github/workflows/release-notes.yml@v1
    with:
      config: changelog.yml
      # Skip the checks and the PR comment on drafts. Needs ready_for_review above.
      skip-drafts: true
