openapi: 3.0.3
info:
  title: Elastic Cloud Monitoring API
  description: Retrieves the AutoOps insights raised for Elastic Cloud deployments, serverless projects, and connected clusters.
  version: 1.0.0
servers:
  - url: /api
    description: Base path of the API.
security:
  - apiKey: []
tags:
  - name: Insights
    description: Endpoints for querying insights matching the specified search criteria or retrieving individual ones by ID.
paths:
  /v1/monitoring/{resourceType}/{resourceId}/insights/_search:
    post:
      summary: Search insights
      description: |
        Returns a paginatable list of insights that were open (active) at any
        point during the selected time interval and that match the specified criteria.
        An insight matches the time interval when it started at or before `to` and it is
        still open, or was closed at or after `from`. By default, only insights that are
        currently open are returned; closed insights that overlapped the selected time
        interval are included only when `include_closed` is set to `true` in the request body.
        Insights of rules that were disabled for the resource are never returned.

        The insights are sorted by their start time (`event.start`).

        Each criterion narrows the results: an insight is returned only when it matches all
        the criteria that are set. Within a criterion that takes a list, an insight matches
        when it matches any of the values.

        Results are paginated with a cursor: when `return_count` equals the page size, which is
        the requested `size` capped at 5000, the response carries a `cursor`; pass it in the next
        request to get the next page. Because a full page always carries a cursor, even when no
        insights remain, the page that follows the last insight can be empty.

        ## Required authorization

        The caller must be authorized to read AutoOps data for the deployment, project, or
        connected cluster named in the path, and the resource must belong to the organization
        of the caller. Access is checked for that single resource on every request.
      operationId: searchInsights
      x-state: Beta
      tags:
        - Insights
      parameters:
        - name: resourceType
          in: path
          required: true
          description: The type of the resource.
          schema:
            $ref: '#/components/schemas/ResourceType'
        - name: resourceId
          in: path
          required: true
          description: |
            The resource ID (Deployment ID, Serverless project ID, or Connected cluster ID)
            to get insights for. It must be a resource of the type given in `resourceType`.
          schema:
            type: string
            example: deployment-123
      requestBody:
        required: false
        description: The search criteria. When the body is omitted, every default applies.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InsightSearchRequest'
            examples:
              basic-time-range:
                summary: Basic time range search (open insights only)
                value:
                  from: '2025-08-01T00:00:00.000Z'
                  to: '2025-08-15T23:59:59.999Z'
                  size: 10
                  order: desc
              full-filter:
                summary: Filtered search with severities, rules, tags, and closed insights
                value:
                  from: '2025-08-01T00:00:00.000Z'
                  to: '2025-08-15T23:59:59.999Z'
                  size: 25
                  order: asc
                  rules:
                    - high_cpu_utilization
                    - disk_watermark_high
                  severities:
                    - high
                    - medium
                  include_closed: true
                  actionable_only: true
                  tags:
                    - domain:performance
                    - scope:node
              next-page:
                summary: Next page of a previous search
                value:
                  cursor: eyJzdCI6MTc1NDA0NDQ0MDAwMCwiaWQiOiI1ZjRmM2UyZC0xYzBiLTBhMDktMDAwMC1hYWJiY2MxMTAwMDEiLCJvIjoiZGVzYyIsImYiOjE3NTQwMDY0MDAwMDAsInQiOjE3NTUzMDIzOTk5OTksInR5IjpbXSwic3YiOltdLCJpYyI6dHJ1ZSwiYW8iOmZhbHNlLCJ0ZyI6W10sIm1vIjpmYWxzZX0
                  size: 10
      responses:
        '200':
          description: The insights that match the search criteria.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsightSearchResponse'
              examples:
                two-insights:
                  summary: Response containing two insights (one closed, one open)
                  value:
                    ok: true
                    match_count: 2
                    return_count: 2
                    insights:
                      - '@timestamp': '2025-08-05T14:20:00.000Z'
                        event:
                          id: 5f4f3e2d-1c0b-0a09-0000-aabbcc110002
                          start: '2025-08-05T14:20:00.000Z'
                          end: '2025-08-05T14:35:00.000Z'
                          duration: 900000000000
                          updated: '2025-08-05T14:35:00.000Z'
                          url: https://api.elastic-cloud.com/api/v1/monitoring/deployments/deployment-abc123/insights/5f4f3e2d-1c0b-0a09-0000-aabbcc110002
                        tags:
                          - deployment:hosted
                          - deployment:self-managed-ccm
                          - component:elasticsearch
                          - scope:node
                          - domain:cpu
                          - domain:performance
                          - domain:stability
                        organization:
                          id: org-456
                        service:
                          type: elasticsearch
                          id: deployment-abc123
                          name: my-production-cluster
                        elasticsearch:
                          cluster:
                            id: cluster-xyz789
                            name: my-production-cluster
                          node:
                            name:
                              - instance-0000000002
                            id:
                              - node-id-456
                            tier: hot
                        observer:
                          name: autoops
                        rule:
                          id: high_cpu_utilization
                          name: High CPU utilization
                          description: High CPU usage can lead to slower response times, reduced throughput, increased error rates, and instability or crashing of the cluster. It can also indicate inefficient resource usage, leading to higher costs. Lastly, if Elasticsearch shares hardware with other applications, its high CPU usage can negatively impact their performance. To avoid these problems, it's crucial to appropriately configure the cluster, optimize operations, monitor performance, and scale resources as necessary.
                        message: The CPU utilization on node instance-0000000002 has crossed the defined threshold of 80 % usage.
                        autoops:
                          title: The CPU utilization on node instance-0000000002 is high
                          severity: medium
                          actions:
                            - type: check_slow_log_for_cpu_intensive_queries
                              title: Enable and review search slow logs
                              description: Enable search slow logs with the action below, then review logs on instance-0000000002 for long-running or repeatedly executed queries. Tune or rewrite expensive queries to reduce CPU load. On 8.14+, set <code>index.search.slowlog.include.user</code> to <code>true</code> to identify which user triggered slow searches.
                              command: |-
                                // this command requires the manage index privilege
                                curl -X PUT "https://my-production-cluster.es.example.com:9243/_settings" -H "Content-Type: application/json" --data @- <<'JSON'
                                { "index.search.slowlog.threshold.query.warn": "10s", "index.search.slowlog.threshold.query.info": "5s", "index.search.slowlog.threshold.query.debug": "2s", "index.search.slowlog.threshold.query.trace": "500ms", "index.search.slowlog.threshold.fetch.warn": "1s", "index.search.slowlog.threshold.fetch.info": "800ms", "index.search.slowlog.threshold.fetch.debug": "500ms", "index.search.slowlog.threshold.fetch.trace": "200ms" }
                                JSON
                      - '@timestamp': '2025-08-01T10:34:00.000Z'
                        event:
                          id: 5f4f3e2d-1c0b-0a09-0000-aabbcc110001
                          start: '2025-08-01T10:34:00.000Z'
                          updated: '2025-08-01T10:49:00.000Z'
                          url: https://api.elastic-cloud.com/api/v1/monitoring/deployments/deployment-abc123/insights/5f4f3e2d-1c0b-0a09-0000-aabbcc110001
                        tags:
                          - deployment:hosted
                          - deployment:self-managed-ccm
                          - component:elasticsearch
                          - scope:node
                          - domain:cpu
                          - domain:performance
                          - domain:stability
                        organization:
                          id: org-456
                        service:
                          type: elasticsearch
                          id: deployment-abc123
                          name: my-production-cluster
                        elasticsearch:
                          cluster:
                            id: cluster-xyz789
                            name: my-production-cluster
                          node:
                            name:
                              - instance-0000000001
                            id:
                              - node-id-123
                            tier: hot
                        observer:
                          name: autoops
                        rule:
                          id: high_cpu_utilization
                          name: High CPU utilization
                          description: High CPU usage can lead to slower response times, reduced throughput, increased error rates, and instability or crashing of the cluster. It can also indicate inefficient resource usage, leading to higher costs. Lastly, if Elasticsearch shares hardware with other applications, its high CPU usage can negatively impact their performance. To avoid these problems, it's crucial to appropriately configure the cluster, optimize operations, monitor performance, and scale resources as necessary.
                        message: The CPU utilization on node instance-0000000001 has crossed the defined threshold of 80 % usage.
                        autoops:
                          title: The CPU utilization on node instance-0000000001 is high
                          severity: medium
                          actions:
                            - type: check_slow_log_for_cpu_intensive_queries
                              title: Enable and review search slow logs
                              description: Enable search slow logs with the action below, then review logs on instance-0000000001 for long-running or repeatedly executed queries. Tune or rewrite expensive queries to reduce CPU load. On 8.14+, set <code>index.search.slowlog.include.user</code> to <code>true</code> to identify which user triggered slow searches.
                              command: |-
                                // this command requires the manage index privilege
                                curl -X PUT "https://my-production-cluster.es.example.com:9243/_settings" -H "Content-Type: application/json" --data @- <<'JSON'
                                { "index.search.slowlog.threshold.query.warn": "10s", "index.search.slowlog.threshold.query.info": "5s", "index.search.slowlog.threshold.query.debug": "2s", "index.search.slowlog.threshold.query.trace": "500ms", "index.search.slowlog.threshold.fetch.warn": "1s", "index.search.slowlog.threshold.fetch.info": "800ms", "index.search.slowlog.threshold.fetch.debug": "500ms", "index.search.slowlog.threshold.fetch.trace": "200ms" }
                                JSON
        '400':
          description: |
            Bad request: a malformed body, a value that cannot be read as the type of its field,
            an unknown enumeration value, an unknown rule ID, a date that is not valid, a `size`
            lower than 1, an invalid cursor, or a `to` date earlier than `from`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                bad-request:
                  summary: Rejected criteria, such as an unknown rule ID
                  value:
                    ok: false
                    error:
                      type: BAD_REQUEST
                invalid-field:
                  summary: Invalid value in a field of the body
                  value:
                    ok: false
                    error:
                      type: BAD_REQUEST
                      details:
                        size:
                          - must be greater than or equal to 1
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: |
            Not found: AutoOps has no resource with that ID for the organization of the caller,
            or the resource is not of the type given in `resourceType`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                not-found:
                  value:
                    ok: false
                    error:
                      type: NOT_FOUND
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
  /v1/monitoring/{resourceType}/{resourceId}/insights/{insightId}:
    get:
      summary: Get insight by ID
      description: |
        Returns a specific insight by ID.

        ## Required authorization

        The caller must be authorized to read AutoOps data for the deployment, project, or
        connected cluster named in the path, and the resource must belong to the organization
        of the caller. Access is checked for that single resource on every request.
      operationId: getInsightById
      x-state: Beta
      tags:
        - Insights
      parameters:
        - name: resourceType
          in: path
          required: true
          description: The type of the resource.
          schema:
            $ref: '#/components/schemas/ResourceType'
        - name: resourceId
          in: path
          required: true
          description: |
            The resource ID (Deployment ID, Serverless project ID, or Connected cluster ID)
            that the insight belongs to. It must be a resource of the type given in `resourceType`.
          schema:
            type: string
            example: deployment-123
        - name: insightId
          in: path
          required: true
          description: The ID of the insight, as returned in `event.id`.
          schema:
            type: string
            format: uuid
            example: 5f4f3e2d-1c0b-0a09-0000-000000000001
      responses:
