<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title description">
  <title id="title">How Context Engine turns source data into reusable context</title>
  <desc id="description">Elasticsearch data and connected systems flow through automations implemented as Elastic Workflows. The automations create Knowledge Indicators and store them in an AI index. Agents retrieve these indicators and can use their guidance to query source data directly for additional or near-real-time information. People can review agent traces to find gaps, refine automations, and regenerate the indicators.</desc>

  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 10 5 0 10Z" fill="#175CD3"/>
    </marker>
    <marker id="arrow-slate" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse" markerUnits="strokeWidth">
      <path d="M0 0 10 5 0 10Z" fill="#667085"/>
    </marker>
    <style>
      text { font-family: Inter, Arial, sans-serif; }
      .heading { font-size: 28px; font-weight: 700; fill: #101828; }
      .intro { font-size: 17px; fill: #475467; }
      .phase { font-size: 13px; font-weight: 700; letter-spacing: 1.2px; fill: #475467; }
      .card-title { font-size: 21px; font-weight: 700; fill: #101828; }
      .card-title-inverse { font-size: 21px; font-weight: 700; fill: #FFFFFF; }
      .body { font-size: 16px; fill: #344054; }
      .body-inverse { font-size: 16px; fill: #FFFFFF; }
      .label { font-size: 14px; font-weight: 600; fill: #475467; }
      .flow-title { font-size: 16px; font-weight: 700; fill: #101828; }
      .flow-body { font-size: 15px; fill: #475467; }
    </style>
  </defs>

  <rect width="1200" height="650" fill="#FFFFFF"/>

  <text x="44" y="45" class="heading">Turn source data into reusable context</text>
  <text x="44" y="76" class="intro">Automations build shared context; agents and applications retrieve it across questions and tasks.</text>

  <rect x="44" y="104" width="810" height="36" rx="8" fill="#F2F4F7"/>
  <text x="449" y="127" text-anchor="middle" class="phase">BUILD CONTEXT</text>
  <rect x="884" y="104" width="272" height="36" rx="8" fill="#F2F4F7"/>
  <text x="1020" y="127" text-anchor="middle" class="phase">USE CONTEXT</text>

  <!-- Source data -->
  <rect x="44" y="166" width="220" height="232" rx="14" fill="#F5FBFF" stroke="#175CD3" stroke-width="2"/>
  <circle cx="86" cy="207" r="20" fill="#D6E9FF"/>
  <ellipse cx="86" cy="200" rx="10" ry="4" fill="none" stroke="#175CD3" stroke-width="1.8"/>
  <path d="M76 200v14c0 2.2 4.5 4 10 4s10-1.8 10-4v-14M76 207c0 2.2 4.5 4 10 4s10-1.8 10-4" fill="none" stroke="#175CD3" stroke-width="1.8"/>
  <text x="116" y="214" class="card-title">Sources</text>

  <rect x="66" y="248" width="176" height="54" rx="8" fill="#D5F5F0"/>
  <text x="154" y="280" text-anchor="middle" class="body">Elasticsearch data</text>
  <rect x="66" y="318" width="176" height="54" rx="8" fill="#D5F5F0"/>
  <text x="154" y="350" text-anchor="middle" class="body">Connected systems</text>

  <!-- Source to automation -->
  <line x1="264" y1="282" x2="318" y2="282" stroke="#175CD3" stroke-width="3" marker-end="url(#arrow-blue)"/>

  <!-- Automations -->
  <rect x="328" y="166" width="242" height="232" rx="14" fill="#175CD3"/>
  <circle cx="370" cy="207" r="20" fill="#FFFFFF" fill-opacity="0.16"/>
  <g transform="translate(358 195) scale(1.5)" fill="#FFFFFF">
    <path d="M7 6.944v2h2v-2H7Zm-5-5v2h2v-2H2Zm3 .5h7a3 3 0 1 1 0 6h-2v.5a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1v-.5H4a2 2 0 1 0 0 4h9.293l-1.646-1.646.707-.707 2.853 2.853-2.854 2.854-.707-.707 1.647-1.647H4a3 3 0 1 1 0-6h2v-.5a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v.5h2a2 2 0 1 0 0-4H5v.5a1 1 0 0 1-1 1H2a1 1 0 0 1-1-1v-2a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v.5Z"/>
  </g>
  <text x="400" y="214" class="card-title-inverse">Automations</text>
  <text x="449" y="253" text-anchor="middle" class="body-inverse">Elastic Workflows</text>
  <line x1="357" y1="271" x2="541" y2="271" stroke="#FFFFFF" stroke-opacity="0.3"/>
  <circle cx="369" cy="298" r="3" fill="#7FF0DB"/>
  <text x="383" y="304" class="body-inverse">Analyze source data</text>
  <circle cx="369" cy="329" r="3" fill="#7FF0DB"/>
  <text x="383" y="335" class="body-inverse">Distill useful context</text>
  <circle cx="369" cy="360" r="3" fill="#7FF0DB"/>
  <text x="383" y="366" class="body-inverse">Apply verification checks</text>

  <!-- Automation to AI index -->
  <line x1="570" y1="282" x2="624" y2="282" stroke="#175CD3" stroke-width="3" marker-end="url(#arrow-blue)"/>

  <!-- AI index -->
  <rect x="634" y="166" width="220" height="232" rx="14" fill="#F5FBFF" stroke="#175CD3" stroke-width="2"/>
  <text x="744" y="211" text-anchor="middle" class="card-title">AI index</text>
  <ellipse cx="744" cy="261" rx="75" ry="24" fill="#D5F5F0" stroke="#0E9384" stroke-width="2"/>
  <path d="M669 261v67c0 13.3 33.6 24 75 24s75-10.7 75-24v-67" fill="#D5F5F0" stroke="#0E9384" stroke-width="2"/>
  <path d="M669 294c0 13.3 33.6 24 75 24s75-10.7 75-24" fill="none" stroke="#0E9384" stroke-width="1.4" stroke-opacity="0.65"/>
  <text x="744" y="283" text-anchor="middle" class="flow-title">Knowledge</text>
  <text x="744" y="305" text-anchor="middle" class="flow-title">Indicators</text>
  <text x="744" y="378" text-anchor="middle" class="body">Reusable context</text>

  <!-- AI index to consumers -->
  <line x1="854" y1="282" x2="908" y2="282" stroke="#175CD3" stroke-width="3" marker-end="url(#arrow-blue)"/>

  <!-- Agents and applications -->
  <rect x="918" y="166" width="238" height="232" rx="14" fill="#F5FBFF" stroke="#175CD3" stroke-width="2"/>
  <circle cx="960" cy="207" r="20" fill="#D6E9FF"/>
  <g transform="translate(948 195) scale(1.5)" fill="#175CD3">
    <path d="M10.447 11.523C9.826 12.767 8.59 13 8 13c-.59 0-1.826-.233-2.447-1.477l.894-.447C6.826 11.833 7.59 12 8 12c.41 0 1.174-.167 1.553-.924l.894.447Z"/>
    <path fill-rule="evenodd" d="M5.5 7a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3Zm0 1a.5.5 0 1 0 0 1 .5.5 0 0 0 0-1Zm5-1a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3Zm0 1a.5.5 0 1 0 0 1 .5.5 0 0 0 0-1Z" clip-rule="evenodd"/>
    <path fill-rule="evenodd" d="M8 0a1.5 1.5 0 0 1 .5 2.912V4H11a3 3 0 0 1 3 3h1l.102.005A1 1 0 0 1 16 8v3a1 1 0 0 1-1 1h-1v2a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1v-2H1a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1h1a3 3 0 0 1 3-3h2.5V2.912A1.498 1.498 0 0 1 8 0ZM5 5a2 2 0 0 0-2 2v7h10V7a2 2 0 0 0-2-2H5Zm-4 6h1V8H1v3Zm13 0h1V8h-1v3ZM8 1a.5.5 0 1 0 0 1 .5.5 0 0 0 0-1Z" clip-rule="evenodd"/>
  </g>
  <text x="990" y="202" class="card-title">Agents and</text>
  <text x="990" y="226" class="card-title">applications</text>
  <rect x="942" y="258" width="190" height="50" rx="8" fill="#D5F5F0"/>
  <text x="1037" y="289" text-anchor="middle" class="body">Answer questions</text>
  <rect x="942" y="322" width="190" height="50" rx="8" fill="#D5F5F0"/>
  <text x="1037" y="353" text-anchor="middle" class="body">Complete tasks</text>

  <!-- Optional live-data path -->
  <path d="M1037 408v53H154v-47" fill="none" stroke="#667085" stroke-width="2" stroke-dasharray="5 5" marker-start="url(#arrow-slate)" marker-end="url(#arrow-slate)"/>
  <rect x="168" y="443" width="850" height="36" rx="18" fill="#FFFFFF" stroke="#D0D5DD"/>
  <text x="593" y="466" text-anchor="middle" class="flow-body">If more detailed or up-to-date information is required, agents can use KI guidance to query source data directly.</text>

  <!-- Human-directed improvement loop -->
  <rect x="44" y="515" width="1112" height="96" rx="12" fill="#F2F4F7"/>
  <circle cx="82" cy="563" r="20" fill="#E4E7EC"/>
  <path d="M70 561a13 13 0 0 1 21-9" fill="none" stroke="#475467" stroke-width="2" stroke-linecap="round"/>
  <path d="M88 548l5 4-5 4" fill="none" stroke="#475467" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M94 565a13 13 0 0 1-21 9" fill="none" stroke="#475467" stroke-width="2" stroke-linecap="round"/>
  <path d="M76 578l-5-4 5-4" fill="none" stroke="#475467" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="116" y="551" class="flow-title">Improve context using evidence from agent traces</text>
  <text x="116" y="578" class="flow-body">Review gaps and repeated work, refine the sources or automations, and regenerate the KIs.</text>
  <path d="M1100 398v110" fill="none" stroke="#667085" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow-slate)"/>
</svg>
